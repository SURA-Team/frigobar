# Git Branching Workflow Extension Configuration
# Copied to .specify/extensions/git/git-config.yml on install

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Optional branch name template. Leave empty for the default "{number}-{slug}".
# Supported tokens: {author}, {app}, {number}, {slug}
# {slug} must not appear before {number}; final path segment must start with {number}-.
# Example for monorepos: "{author}/{app}/{number}-{slug}"
branch_template: ""

# Optional shorthand namespace. Leave empty to use branch_template/default behavior.
# Example: "features/{app}" expands to "features/{app}/{number}-{slug}"
branch_prefix: ""

# Commit message used by `git commit` during repository initialization
init_commit_message: "[Spec Kit] Commit inicial"

# Commit message style used by auto-commit hooks (speckit.git.commit):
# "fixed"        - default; use the configured/static messages below.
# "conventional" - ask the agent to inspect the diff and generate a
#                  Conventional Commit message (e.g. "feat: add OAuth spec")
#                  instead of using the messages configured below.
commit_style: fixed

# Auto-commit before/after core commands.
# Set "default" to enable for all commands, then override per-command.
# Each key can be true/false. Message is customizable per-command.
auto_commit:
  default: true
  before_clarify:
    enabled: true
    message: "[Spec Kit] Salva progresso antes da clarificação"
  before_plan:
    enabled: true
    message: "[Spec Kit] Salva progresso antes do plano"
  before_tasks:
    enabled: true
    message: "[Spec Kit] Salva progresso antes das tarefas"
  before_implement:
    enabled: true
    message: "[Spec Kit] Salva progresso antes da implementação"
  before_checklist:
    enabled: true
    message: "[Spec Kit] Salva progresso antes do checklist"
  before_analyze:
    enabled: true
    message: "[Spec Kit] Salva progresso antes da análise"
  before_taskstoissues:
    enabled: true
    message: "[Spec Kit] Salva progresso antes de sincronizar issues"
  after_constitution:
    enabled: true
    message: "[Spec Kit] Adiciona constituição do projeto"
  after_specify:
    enabled: true
    message: "[Spec Kit] Adiciona especificação"
  after_clarify:
    enabled: true
    message: "[Spec Kit] Clarifica especificação"
  after_plan:
    enabled: true
    message: "[Spec Kit] Adiciona plano de implementação"
  after_tasks:
    enabled: true
    message: "[Spec Kit] Adiciona tarefas"
  after_implement:
    enabled: true
    message: "[Spec Kit] Progresso da implementação"
  after_checklist:
    enabled: true
    message: "[Spec Kit] Adiciona checklist"
  after_analyze:
    enabled: true
    message: "[Spec Kit] Ajustes da análise"
  after_taskstoissues:
    enabled: true
    message: "[Spec Kit] Sincroniza tarefas com issues"
